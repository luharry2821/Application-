<style>
  :root {

  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  header { padding: 22px 28px 4px; text-align: center; }

  header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  main { padding: 10px 24px 48px; max-width: 1040px; margin: 0 auto; }

  button {
    font: inherit;
    border: 1px solid var(--edge);
    background: #1a2436;
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;

  button:hover:not(:disabled) { background: #223150; }
  button:active:not(:disabled) { transform: translateY(1px); }

  button.big { padding: 14px 30px; font-size: 16px; border-radius: 999px; }
  .hidden { display: none !important; }

  .status { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #586480; }
  .dot.live { background: var(--good); box-shadow: 0 0 0 4px rgba(110,231,168,.15); }
  .dot.err  { background: var(--bad); }

  #error {
    display: none; margin: 0 0 18px; padding: 12px 14px;
    border: 1px solid #6b2d2d; background: #2a1515; color: #ffd5d5;
    border-radius: 10px; font-size: 14px;
  }

  .stage { display: grid; grid-template-columns: 1fr 360px; gap: 28px; align-items: start; }
  @media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }

  .centerpiece {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 22px; padding: 30px 10px 10px;
  }
  /* Pulsing call orb */
  .orb {
    position: relative; width: 230px; height: 230px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 38%, #2a3f63 0%, #142036 70%);
    box-shadow: 0 24px 55px rgba(0,0,0,.5), inset 0 0 60px rgba(0,0,0,.55);
  }
  .orb .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(79,195,247,.35);
  }
  .orb.live .ring { animation: ripple 2.4s ease-out infinite; }
  @keyframes ripple {
    0% { transform: scale(.7); opacity: .9; }
    100% { transform: scale(1.25); opacity: 0; }
  }
  .orb .face { font-size: 46px; }
  .orb .name { position: absolute; bottom: 30px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

  .prompt { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.3; max-width: 460px; }
  .controls { display: flex; gap: 10px; }

  aside {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px;
    padding: 14px; height: fit-content; position: sticky; top: 16px;
  }
  aside h2 { margin: 2px 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
  #transcript { display: flex; flex-direction: column; gap: 8px; max-height: 62vh; overflow-y: auto; }

  .line.partial { opacity: .6; font-style: italic; }
  .empty { color: var(--muted); font-size: 13px; }

const SYSTEM_PROMPT = `You are Ava, the voice assistant for Skyline Car Rental. You answer questions
and handle reservations over the phone. You are warm, efficient, and sound like
a real person who works the desk, not a script.

# HOW YOU TALK (this is a voice call, not a chat)

- When you collect details, read them back briefly to confirm before you act.

- If you don't know something or it needs a human, say so and offer to connect them.

# WHAT YOU CAN AND CAN'T DO
- Pickup and dropoff are at airport locations only. If someone asks for a

- You can book, look up, modify, cancel, and extend reservations, add drivers or

# GREETING
Start with: "Thanks for calling Skyline Car Rental, this is Ava. How can I help
you today?"
Then listen and route to the right flow below based on what they need.

# HOW TO QUOTE A TOTAL (always do this math before giving a price)
Work it out step by step, then say only the final number to the customer:
1. Start with the car's daily rate (see Reference Data).
2. Add any per-day rental protection and per-day extras (GPS, child seat, extra
   driver) to the daily rate to get a combined daily rate.
3. Multiply the combined daily rate by the number of rental days to get the subtotal.
4. Add taxes and fees: subtotal x TAX_RATE. Add that to the subtotal for the total.
5. Quote the total to the customer, and you can mention the daily rate too.

Formula: total = (daily_rate + protection_per_day + extras_per_day) x days x (1 + 0.25)

Example to follow: a $65 SUV for 3 days with $25 standard protection.
Combined daily = 65 + 25 = $90. Subtotal = 90 x 3 = $270. Taxes at 25% =
$67.50. Total = $337.50. You'd say: "That's $90 a day, so $337.50 total
with taxes and fees for the three days. Want me to lock it in?"

# ---------- FLOWS ----------

## NEW RESERVATION
1. Let them know their options first: "You can book on our website, through a

   verify your details and finish up. Complete that before you arrive, and you'll

2. Call lookup_reservation with both. If no match, say so and offer to try again

## ROADSIDE ASSISTANCE (breakdown, flat tire, dead battery, lockout)
1. First: "Are you somewhere safe right now?" Prioritize their safety.
2. Get the issue type, their location, and the reservation phone number or
   license number to identify the rental.

Answer directly from Reference Data, short and conversational:

If the question isn't covered, say you're not certain and offer to connect them
to a representative.

- One question at a time. Short spoken answers. Read back before acting.
- Always verify identity (phone + license) before touching an existing booking.
- Always confirm safety first on roadside and accident calls.
- If asked for anything outside these flows, offer to connect them to a human.`;

/* ============================================================================
 * Audio: capture (mic -> PCM16 24k -> base64) and playback (24k buffers).
 * ==========================================================================*/
let audioCtx = null, micStream = null, micSourceNode = null, workletNode = null, outGain = null;
let playHead = 0;
const activeSources = new Set();

const WORKLET_SRC = `
class PCM16Worklet extends AudioWorkletProcessor {
  constructor() { super(); this._buf = new Float32Array(0); this._target = ${FRAME_SAMPLES}; }
  process(inputs) {
    const input = inputs[0];
    if (input && input[0]) {
      const ch = input[0];
      const merged = new Float32Array(this._buf.length + ch.length);
      merged.set(this._buf, 0); merged.set(ch, this._buf.length);
      this._buf = merged;
      while (this._buf.length >= this._target) {
        const frame = this._buf.subarray(0, this._target);
        const i16 = new Int16Array(this._target);
        for (let i = 0; i < this._target; i++) {
          let s = Math.max(-1, Math.min(1, frame[i]));
          i16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        this.port.postMessage(i16.buffer, [i16.buffer]);
        this._buf = this._buf.slice(this._target);
      }
    }
    return true;
  }
}
registerProcessor('pcm16-worklet', PCM16Worklet);
`;

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: false, autoGainControl: true },
  });
  const blobUrl = URL.createObjectURL(new Blob([WORKLET_SRC], { type: "application/javascript" }));
  await audioCtx.audioWorklet.addModule(blobUrl);
  micSourceNode = audioCtx.createMediaStreamSource(micStream);
  workletNode = new AudioWorkletNode(audioCtx, "pcm16-worklet");
  workletNode.port.onmessage = (e) => sendAudio(e.data);
  const silent = audioCtx.createGain();
  silent.gain.value = 0;
  micSourceNode.connect(workletNode);
  workletNode.connect(silent);
  silent.connect(audioCtx.destination);
}

function stopMic() {
  try { workletNode && workletNode.disconnect(); } catch (e) {}
  try { micSourceNode && micSourceNode.disconnect(); } catch (e) {}
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  workletNode = micSourceNode = micStream = null;
}

function playChunk(int16) {
  const f32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 0x8000;
  const buf = audioCtx.createBuffer(1, f32.length, SAMPLE_RATE);
  buf.copyToChannel(f32, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(outGain);
  const now = audioCtx.currentTime;
  if (playHead < now) playHead = now + 0.02;
  src.start(playHead);
  playHead += buf.duration;
  activeSources.add(src);
  src.onended = () => activeSources.delete(src);
}

// Barge-in flush: drop queued agent audio so the user never hears stale speech.
function flushPlayback() {
  for (const s of activeSources) { try { s.stop(); } catch (e) {} }
  activeSources.clear();
  playHead = 0;
  if (outGain) { try { outGain.disconnect(); } catch (e) {} }
  outGain = audioCtx.createGain();
  outGain.connect(audioCtx.destination);
}

/* ============================================================================
 * Base64 <-> PCM16
 * ==========================================================================*/
function arrayBufferToB64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = "";
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  return btoa(bin);
}
function b64ToInt16(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Int16Array(bytes.buffer);
}

/* ============================================================================
 * WebSocket session lifecycle
 * ==========================================================================*/
let ws = null, sessionReady = false, sessionId = null;
let lastEvent = null;
let pendingResults = [];

function flushToolResultsIfIdle() {
  if (lastEvent !== "reply.done" || !pendingResults.length) return;
  for (const r of pendingResults) {
    ws.send(JSON.stringify({
      type: "tool.result",
      call_id: r.call_id,
      result: JSON.stringify(r.result), // result must be a JSON string
    }));
  }
  pendingResults = [];
}

async function getAuthToken() {
  const res = await fetch(TOKEN_PROXY_URL);
  if (!res.ok) {
    throw new Error(`Token request failed (${res.status}). Is the server running ` +
      "with ASSEMBLYAI_API_KEY set?");
  }
  const data = await res.json();
  if (!data.token) throw new Error("Token endpoint returned no token.");
  return data.token;
}

async function connect() {
  clearError();
  connectBtn.disabled = true;
  connectBtn.textContent = "Connecting…";
  setStatus("Connecting…", "");
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
    await audioCtx.resume();
    outGain = audioCtx.createGain();
    outGain.connect(audioCtx.destination);

    const token = await getAuthToken();
    ws = new WebSocket(`${WS_URL}?token=${encodeURIComponent(token)}`);
    ws.binaryType = "arraybuffer";
    ws.onopen = onWsOpen;
    ws.onmessage = onWsMessage;
    ws.onerror = () => setStatus("Socket error", "err");
    ws.onclose = onWsClose;
  } catch (err) {
    showError("Could not connect: " + err.message);
    setStatus("Disconnected", "err");
    connectBtn.disabled = false;
    connectBtn.textContent = "Start call";
    teardownAudio();
  }
}

function onWsOpen() {
  // Configure the session immediately; don't wait for session.ready.
  ws.send(JSON.stringify({
    type: "session.update",
    session: {
      system_prompt: SYSTEM_PROMPT,
      greeting: GREETING,
      input: {
        format: { encoding: "audio/pcm" },   // PCM16 24 kHz
        keyterms: KEYTERMS,
        turn_detection: {
          vad_threshold: 0.5,
          min_silence: 400,
          max_silence: 1280,
          interrupt_response: true,            // allow barge-in
        },
      },
      output: {
        voice: AGENT_VOICE,
        format: { encoding: "audio/pcm" },
      },
      tools: TOOLS,
    },
  }));
  setStatus("Session starting…", "");
}

async function onWsMessage(evt) {
  let msg;
  try { msg = JSON.parse(evt.data); } catch (e) { return; }

  switch (msg.type) {
    case "session.ready":
      sessionReady = true;
      sessionId = msg.session_id || sessionId;
      setLiveUI(true);
      setStatus("Live — go ahead", "live");
      connectBtn.disabled = false;
      connectBtn.textContent = "Start call";
      try { await startMic(); }
      catch (err) { showError("Microphone error: " + err.message); setStatus("No mic", "err"); }
      break;

    case "input.speech.started":
      lastEvent = "input.speech.started";
      flushPlayback();   // barge-in
      break;

    case "input.speech.stopped":
      break;

    case "transcript.user.delta":
      renderPartial("user", msg.transcript || msg.text || "");
      break;

    case "transcript.user":
      renderFinal("user", msg.transcript || msg.text || "");
      break;

    case "reply.started":
      lastEvent = "reply.started";
      break;

    case "reply.audio": {
      // Output audio is in `data` (input.audio uses `audio`). Don't mix up.
      const b64 = msg.data;
      if (b64) playChunk(b64ToInt16(b64));
      break;
    }

    case "transcript.agent":
      renderFinal("agent", msg.transcript || msg.text || "");
      break;

    case "reply.done":
      lastEvent = "reply.done";
      if (msg.status === "interrupted") {
        flushPlayback();
        pendingResults = [];   // discard tool work the user interrupted
      } else {
        flushToolResultsIfIdle();
      }
      break;

    case "tool.call":
      handleToolCall(msg);     // async: relay to FastAPI, then send tool.result
      break;

    case "session.error":
      showError("Session error: " + (msg.message || msg.code || "unknown"));
      setStatus("Error", "err");
      break;

    default:
      break;
  }
}

// Relay a tool call to the FastAPI server and queue the result. The result is
// only sent once reply.done is the latest event (flushToolResultsIfIdle), so we
// never interleave a tool.result into a transition phrase.
async function handleToolCall(msg) {
  renderTool(`Ava is using ${msg.name}…`);
  let result;
  try {
    const res = await fetch(`/tools/${encodeURIComponent(msg.name)}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(msg.arguments || {}),
    });
    result = await res.json();
  } catch (e) {
    result = { error: "Tool request failed: " + String(e) };
  }
  pendingResults.push({ call_id: msg.call_id, result });
  flushToolResultsIfIdle();    // slow-tool case: reply.done may already be last
}

function onWsClose(evt) {
  sessionReady = false;
  setLiveUI(false);
  connectBtn.disabled = false;
  connectBtn.textContent = "Start call";
  teardownAudio();
  if (evt && evt.code === 1006) {
    setStatus("Closed (1006)", "err");
    showError("Connection closed before handshake (1006) — the token was rejected. " +
      "Check that the server has a valid ASSEMBLYAI_API_KEY.");
  } else {
    setStatus("Call ended", "");
  }
}

function disconnect() {
  // Graceful end: ask the server to terminate, then close.
  try { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "session.terminate" })); } catch (e) {}
  if (ws && ws.readyState <= 1) ws.close();
  ws = null;
}

function teardownAudio() {
  stopMic();
  if (audioCtx) { try { flushPlayback(); } catch (e) {} audioCtx.close().catch(() => {}); audioCtx = null; }
  outGain = null;
  sessionReady = false;
}

function sendAudio(arrayBuffer) {
  if (!sessionReady || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "input.audio", audio: arrayBufferToB64(arrayBuffer) }));
}

/* ============================================================================
 * Transcript rendering
 * ==========================================================================*/
function ensureTranscriptCleared() {
  const empty = transcriptEl.querySelector(".empty");
  if (empty) empty.remove();
}
let partialEls = { user: null, agent: null };

function renderPartial(who, text) {
  ensureTranscriptCleared();
  if (!partialEls[who]) {
    const el = document.createElement("div");
    el.className = `line ${who} partial`;
    el.innerHTML = `<span class="who">${who === "user" ? "You" : "Ava"}</span><span class="txt"></span>`;
    transcriptEl.appendChild(el);
    partialEls[who] = el;
  }
  partialEls[who].querySelector(".txt").textContent = text;
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function renderFinal(who, text) {
  ensureTranscriptCleared();
  if (!text) { if (partialEls[who]) { partialEls[who].remove(); partialEls[who] = null; } return; }
  if (partialEls[who]) {
    partialEls[who].classList.remove("partial");
    partialEls[who].querySelector(".txt").textContent = text;
    partialEls[who] = null;
  } else {
    const el = document.createElement("div");
    el.className = `line ${who}`;
    el.innerHTML = `<span class="who">${who === "user" ? "You" : "Ava"}</span><span class="txt"></span>`;
    el.querySelector(".txt").textContent = text;
    transcriptEl.appendChild(el);
  }
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function renderTool(text) {
  ensureTranscriptCleared();
  const el = document.createElement("div");
  el.className = "line tool";
  el.textContent = text;
  transcriptEl.appendChild(el);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

/* ============================================================================
 * Startup
 * ==========================================================================*/
connectBtn.addEventListener("click", connect);
disconnectBtn.addEventListener("click", disconnect);
setStatus("Ready", "");
